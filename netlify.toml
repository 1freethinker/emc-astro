# Netlify build config for the static Astro site.
# Set PUBLIC_WEB3FORMS_KEY under Site settings -> Environment variables
# (needed at build time for the contact form).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old WordPress URLs are redirected by Astro's `redirects` config
# (src/data/redirects.json), which emits redirect pages into `dist/`.
# Netlify serves its own 404.html (generated by Astro) for anything else.
